[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "AI_Error_Check_Agent"
version = "0.5.0"
description = "IRIS deployment log diagnosis with verifiable evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "python-dotenv>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
ai-error-check = "ai_error_check_agent.cli:main"
ai-error-check-api = "ai_error_check_agent.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_error_check_agent = ["agent/*.md", "agent/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"


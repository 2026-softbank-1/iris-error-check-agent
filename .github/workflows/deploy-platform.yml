name: Deploy platform

# 수동 배포 전용. iris/error-check-agent 이미지를 빌드·push 하고, digest 만
# iris-gitops-environments 의 이 레포 전용 파일(platform/aws-dev-management/error-check-agent.yaml)에 커밋한다.
# 키는 iris-platform chart 의 errorAgent 이고, 실행 방식(enabled·secret·model)은
# iris-infra clusters/aws-dev-management/values/platform.yaml 이 정한다.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: deploy-platform

env:
  AWS_ACCOUNT_ID: '187069338876'
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: iris/error-check-agent
  VALUES_FILE: platform/aws-dev-management/error-check-agent.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ECR push 역할(iris-dev-github-ecr-error-check-agent)은 main 만 신뢰한다.
      - name: Require main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::main 에서만 배포한다."; exit 1; }'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/iris-dev-github-ecr-error-check-agent
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      # iris-gitops-environments 하나에 contents:write 만 가진 1시간 토큰
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: '5148916'
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: iris-gitops-environments
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/iris-gitops-environments
          token: ${{ steps.token.outputs.token }}
          path: gitops
      - name: Commit digest
        working-directory: gitops
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::잘못된 digest: $DIGEST"; exit 1; }
          mkdir -p "$(dirname "$VALUES_FILE")"
          [[ -f "$VALUES_FILE" ]] || echo '{}' > "$VALUES_FILE"
          jq -S --arg d "$DIGEST" '.errorAgent.image.digest = $d' "$VALUES_FILE" > v.tmp
          mv v.tmp "$VALUES_FILE"
          git config user.name 'iris-platform-deploy[bot]'
          git config user.email 'iris-platform-deploy@users.noreply.github.com'
          git add "$VALUES_FILE"
          git diff --cached --quiet && { echo 'Already deployed.'; exit 0; }
          git commit -q -m "deploy platform errorAgent: iris-error-check-agent ${GITHUB_SHA::7}" \
            -m "Iris-Source-Sha: $GITHUB_SHA"$'\n'"Iris-Image-Digest: $DIGEST"
          # 다른 레포의 배포 커밋과 겹치면 rebase 후 다시 push (다른 파일이라 충돌 없음)
          for _ in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; done
          exit 1
